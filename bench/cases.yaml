- id: long-ramble
  kind: normal
  prev: What's your typical day like?
  user: In morning I wake up at eight, I drink coffee, after I check email and Upwork, then I am coding until evening, sometimes I go gym.
  recast: ["in the morning", "go to the gym", "i code", "then"]

- id: question-back
  kind: normal
  prev: Do you have any questions for me?
  user: Yes, where are you from and what you do in weekend?
  recast: ["what do you do", "on the weekend", "at the weekend", "on weekends"]
