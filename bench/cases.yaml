# A meta message ("I don't know how to tell the client") written in the native language right after a help hint.
# The reply should translate it in first person (recast keywords), not hand the earlier hint back (avoid).
- id: meta-after-hint-tr
  kind: native
  prev:
    - {role: assistant, content: "How would you tell your client that the project will be a week late?"}
    - {role: user, content: "Help."}
    - {role: assistant, content: "Try starting with: I wanted to give you a heads-up about..."}
  user: "Müşteriye nasıl söylerim bilmiyorum."
  recast: ["don't know how", "do not know how", "how to tell", "how do i tell", "how should i tell", "how i should tell"]
  avoid: ["heads-up", "heads up"]

- id: meta-after-hint-es
  kind: native
  native: es
  prev:
    - {role: assistant, content: "How would you tell your client that the project will be a week late?"}
    - {role: user, content: "Help."}
    - {role: assistant, content: "Try starting with: I wanted to give you a heads-up about..."}
  user: "No sé cómo decírselo al cliente."
  recast: ["don't know how", "do not know how", "how to tell", "how do i tell", "how should i tell", "how i should tell"]
  avoid: ["heads-up", "heads up"]

