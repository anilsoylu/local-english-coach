[project]
name = "english-coach"
version = "0.1.0"
description = "Local English conversation coach for language learners (Ollama + FastAPI)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6",
    "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[webrtc,runner,whisper,kokoro]==1.16.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[tool.uv]
package = false
