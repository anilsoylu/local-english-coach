<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
<title>English Coach</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1e20; --muted: #6b6e73; --line: #e3e1dc;
    --accent: #2f6f5e; --accent-text: #ffffff; --me: #2f6f5e; --me-text: #ffffff; --warn: #9a5b13;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151618; --surface: #1f2124; --text: #e9e8e4; --muted: #9a9ca0; --line: #2e3034;
      --accent: #5fb39a; --accent-text: #0f1a16; --me: #2f6f5e; --me-text: #f1f7f4; --warn: #e0a45a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  header h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 650; }
  select, button, textarea { font: inherit; color: inherit; }
  select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    max-width: 55vw;
  }
  button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px;
    cursor: pointer; touch-action: manipulation; user-select: none;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  @media (hover: hover) { button:not(:disabled):hover { filter: brightness(.96); } }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .warm li { margin: 4px 0; }
  .warm .tr { color: var(--muted); }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .coach { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .me.help { opacity: .8; font-style: italic; }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .typing::after { animation: none; } }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; padding: 0 16px; }
  footer {
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 40vh; padding: 11px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); font-size: 16px; /* 16px stops iOS zoom */
  }
  .tools { display: flex; gap: 8px; margin-top: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .tools label { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .timer { font-variant-numeric: tabular-nums; min-width: 3ch; }
  .timer.slow { color: var(--warn); }
  .report .err { margin: 10px 0; }
  .report .orig { text-decoration: line-through; color: var(--muted); }
  .report .better { font-weight: 600; }
  .report .note { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>English Coach</h1>
    <select id="scenario" aria-label="Senaryo"></select>
    <button id="start" class="primary">Başla</button>
    <button id="end" class="hidden">Bitir</button>
  </header>

  <main id="log" aria-live="polite">
    <p class="empty" id="empty">Bir senaryo seç ve Başla'ya bas. İngilizce yaz ya da klavyenin mikrofonuyla konuş. Takılırsan Türkçe yaz ya da "Takıldım"a bas.</p>
  </main>

  <footer id="composer" class="hidden">
    <div class="row">
      <!-- autocorrect/spellcheck off: the coach has to see your real mistakes -->
      <textarea id="input" rows="1" lang="en" placeholder="Type in English…" autocomplete="off"
        autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send"></textarea>
      <button id="send" class="primary" aria-label="Gönder">Gönder</button>
    </div>
    <div class="tools">
      <button id="help" type="button">Takıldım</button>
      <label><input type="checkbox" id="timerToggle"> Süre</label>
      <span id="timer" class="timer hidden">0</span>
    </div>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input");
let sid = null, busy = false, readyAt = null, tick = null;

function store(key, val) { try { val === undefined ? null : localStorage.setItem(key, val); return localStorage.getItem(key); } catch { return null; } }

function add(cls, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
  return el;
}

function card(title, html) {
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `<h2>${title}</h2>` + html;
  $("empty")?.remove();
  log.appendChild(el);
  return el;
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function startTimer() {
  readyAt = performance.now();
  clearInterval(tick);
  if (!$("timerToggle").checked) return;
  $("timer").classList.remove("hidden");
  tick = setInterval(() => {
    const s = Math.floor((performance.now() - readyAt) / 1000);
    $("timer").textContent = s;
    $("timer").classList.toggle("slow", s >= 30);
  }, 250);
}

async function loadScenarios() {
  const list = await (await fetch("api/scenarios")).json();
  const last = store("scenario");
  $("scenario").innerHTML = list.map((s) => `<option value="${s.id}"${s.id === last ? " selected" : ""}>${esc(s.title)}</option>`).join("");
}

async function start() {
  $("start").disabled = true;
  store("scenario", $("scenario").value);
  log.innerHTML = "";
  const r = await fetch("api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scenario: $("scenario").value }) });
  if (!r.ok) { add("coach", "Seans başlatılamadı."); $("start").disabled = false; return; }
  const data = await r.json();
  sid = data.session_id;
  if (data.warmup.length) {
    card("Bugün kullanmayı dene", `<ul class="warm">${data.warmup.map((c) => `<li><b>${esc(c.phrase)}</b> <span class="tr">${esc(c.meaning)}</span></li>`).join("")}</ul>`);
  }
  add("coach", data.opening);
  $("start").classList.add("hidden");
  $("scenario").disabled = true;
  $("end").classList.remove("hidden");
  $("composer").classList.remove("hidden");
  input.focus();
  startTimer();
}

async function send(text, isHelp = false) {
  text = text.trim();
  if (!text || busy || !sid) return;
  busy = true; $("send").disabled = true; $("help").disabled = true;
  const responseMs = readyAt ? Math.round(performance.now() - readyAt) : null;
  clearInterval(tick); $("timer").classList.add("hidden");
  add("me" + (isHelp ? " help" : ""), text);
  input.value = ""; autosize();
  const out = add("coach typing", "");
  try {
    const r = await fetch(`api/session/${sid}/message`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, response_ms: isHelp ? null : responseMs }),
    });
    if (!r.ok) throw new Error(r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      out.textContent += dec.decode(value, { stream: true });
      out.scrollIntoView({ block: "end" });
    }
  } catch (e) {
    out.textContent = "Bağlantı hatası, tekrar dene.";
  }
  out.classList.remove("typing");
  busy = false; $("send").disabled = false; $("help").disabled = false;
  input.focus();
  startTimer();
}

async function end() {
  if (!sid) return;
  $("end").disabled = true;
  $("composer").classList.add("hidden");
  clearInterval(tick);
  await fetch(`api/session/${sid}/end`, { method: "POST" });
  const wait = card("Seans raporu", `<p class="note">Analiz ediliyor, bu birkaç dakika sürebilir…</p>`);
  wait.scrollIntoView({ block: "end", behavior: "smooth" });
  const id = sid;
  for (let i = 0; i < 120; i++) {
    await new Promise((res) => setTimeout(res, 3000));
    const rep = await (await fetch(`api/session/${id}/report`)).json();
    if (rep.ready) { renderReport(wait, rep); break; }
  }
  sid = null;
  $("end").classList.add("hidden"); $("end").disabled = false;
  $("start").classList.remove("hidden"); $("start").disabled = false; $("scenario").disabled = false;
}

function renderReport(el, { metrics: m, report: r }) {
  const stat = (v, label) => v === null || v === undefined ? "" : `<div class="stat"><b>${esc(v)}</b><span>${label}</span></div>`;
  let html = `<div class="stats">
    ${stat(m.user_turns, "mesaj")}
    ${stat(m.avg_words, "ortalama kelime")}
    ${stat(m.median_response_s, "cevap süresi (sn)")}
    ${stat(m.help_count + (m.turkish_turns || 0) + (m.mixed_turns || 0), "takılma")}
    ${stat((m.chunks_used || []).length + "/" + (m.chunks_offered ?? 0), "kalıp kullanıldı")}
  </div>`;
  if (r.feedback_tr) html += `<p>${esc(r.feedback_tr)}</p>`;
  if (r.errors?.length) html += `<h2>Düzeltmeler</h2>` + r.errors.map((e) => `<div class="err"><div class="orig">${esc(e.original)}</div><div class="better">${esc(e.better)}</div><div class="note">${esc(e.note_tr)}</div></div>`).join("");
  if (r.natural?.length) html += `<h2>Daha doğal söyleyiş</h2>` + r.natural.map((n) => `<div class="err"><div class="note">${esc(n.original)}</div><div class="better">${esc(n.natural)}</div></div>`).join("");
  if (r.chunks?.length) html += `<h2>Yeni kalıplar</h2><ul class="warm">` + r.chunks.map((c) => `<li><b>${esc(c.phrase)}</b> <span class="tr">${esc(c.meaning_tr)}</span><br><span class="note">${esc(c.example)}</span></li>`).join("") + `</ul>`;
  if (!r.errors && !r.feedback_tr) html += `<p class="note">Analiz için seans çok kısaydı.</p>`;
  el.innerHTML = `<h2>Seans raporu</h2>` + html;
  el.classList.add("report");
  el.scrollIntoView({ block: "start", behavior: "smooth" });
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + "px"; }

input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
$("send").onclick = () => send(input.value);
$("help").onclick = () => send("Help.", true);
$("start").onclick = start;
$("end").onclick = end;
$("timerToggle").checked = store("timer") === "1";
$("timerToggle").onchange = (e) => { store("timer", e.target.checked ? "1" : "0"); if (e.target.checked) startTimer(); else { clearInterval(tick); $("timer").classList.add("hidden"); } };
loadScenarios();
</script>
</body>
</html>
