        ko: "다시 한다면, ...할 거예요"
        zh: "如果再做一次，我会……"

- id: travel
  title:
    en: Travel (airport, hotel, restaurant)
    tr: Seyahat (havalimanı, otel, restoran)
    es: Viajes (aeropuerto, hotel, restaurante)
    pt-BR: Viagem (aeroporto, hotel, restaurante)
    de: Reisen (Flughafen, Hotel, Restaurant)
    fr: Voyage (aéroport, hôtel, restaurant)
    it: Viaggi (aeroporto, hotel, ristorante)
    pl: Podróże (lotnisko, hotel, restauracja)
    ru: Путешествия (аэропорт, отель, ресторан)
    ja: 旅行（空港、ホテル、レストラン）
    ko: 여행 (공항, 호텔, 식당)
    zh: 旅行（机场、酒店、餐厅）
  role: a hotel receptionist, then a waiter, depending on where the conversation goes
