# Fixed learner turns for comparing models and prompt versions.
# kind: normal | native (the learner writes in their native language) | help | unfinished
# native: the learner's native language code (coach/languages.py), default tr.
# recast: the reply should contain at least one of these (case-insensitive) to count as a recast.
# avoid: the reply must not contain any of these (case-insensitive), e.g. an earlier hint repeated.
# prev: the coach's previous line, or a list of {role, content} turns when the case needs more history.

- id: past-simple-1
  kind: normal
  prev: How was your weekend?
  user: I go to my friend house and we eating dinner.
  recast: ["went", "friend's"]

- id: past-simple-2
  kind: normal
  prev: What did you do yesterday after work?
  user: Yesterday I am working until late, after I watch a film.
  recast: ["worked", "were working", "watched"]

- id: possessive
  kind: normal
  prev: Who did you meet last week?
  user: I meet my brother wife, she is very nice.
  recast: ["brother's wife", "met"]

- id: article
  kind: normal
  prev: Where do you usually work?
  user: I work from home, I have small office in my apartment.
  recast: ["a small office"]

- id: third-person
  kind: normal
  prev: Tell me about your last client.
  user: My client want a mobile app, he need it in two months.
  recast: ["wants", "needs"]

- id: present-perfect
  kind: normal
  prev: Have you ever worked with a big company?
  user: Yes I am working with a bank before, three years ago.
  recast: ["worked", "have worked"]

- id: plural
  kind: normal
  prev: What do you build for clients?
  user: I make many website and two mobile application this year.
  recast: ["websites", "applications", "apps"]

- id: word-order
  kind: normal
  prev: What do you like about freelancing?
  user: I like very much freelancing because flexible is time.
  recast: ["really like", "like freelancing", "flexible"]

- id: preposition
  kind: normal
  prev: When did you start freelancing?
  user: I started freelance at 2024, before I was in a company.
  recast: ["in 2024"]

- id: future
  kind: normal
  prev: What are your plans for next month?
  user: Next month I will to go Istanbul for a meeting with client.
  recast: ["go to istanbul", "going to istanbul", "a client"]

- id: correct-sentence
  kind: normal
  prev: What did you have for breakfast?
  user: I had eggs and some cheese with tea.
  recast: []

- id: short-answer
  kind: normal
  prev: Do you like your job?
