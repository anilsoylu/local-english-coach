- id: friend-chat
  title:
    en: Chat with a friend from abroad
    tr: Arkadaş sohbeti (yurtdışından bir arkadaş)
    es: Charla con un amigo del extranjero
    pt-BR: Papo com um amigo do exterior
    de: Chat mit einem Freund aus dem Ausland
    fr: Discussion avec un ami de l'étranger
    it: Chat con un amico dall'estero
    pl: Rozmowa z przyjacielem z zagranicy
    ru: Переписка с другом из-за границы
    ja: 海外の友達とのおしゃべり
    ko: 해외 친구와 대화
    zh: 和国外的朋友聊天
  role: a friend from another country who chats with {name} on Instagram. Share small things from your own week too, like a real friend
  setting: Relaxed chat about daily life, plans, work, travel and whatever comes up.
  persona: true
  opening: "Heyy {name}! What have you been up to lately?"
  chunks:
    - phrase: "Not much, just ..."
      meaning:
        en: "Nothing much, only ..."
        tr: "Pek bir şey yok, sadece ..."
        es: "Nada especial, solo ..."
        pt-BR: "Nada demais, só ..."
        de: "Nicht viel, nur ..."
        fr: "Pas grand-chose, juste ..."
        it: "Niente di che, solo ..."
        pl: "Nic szczególnego, tylko ..."
        ru: "Да ничего особенного, просто ..."
        ja: "特に何もなくて、ただ..."
        ko: "별로 없고, 그냥 ..."
        zh: "没什么大事，就是……"
    - phrase: "I've been so busy with ..."
      meaning:
        en: "I had a lot of work with ..."
        tr: "... ile çok meşguldüm"
        es: "Tuve mucho trabajo con ..."
        pt-BR: "Tive muito trabalho com ..."
        de: "Ich hatte viel zu tun mit ..."
        fr: "J'ai eu beaucoup de travail avec ..."
        it: "Ho avuto molto da fare con ..."
        pl: "Miałem dużo roboty z ..."
        ru: "У меня было много дел с ..."
        ja: "...でとても忙しかった"
        ko: "...때문에 정말 바빴어요"
        zh: "我因为……忙得不可开交"
    - phrase: "That sounds like fun!"
      meaning:
        en: "I think that will be fun."
        tr: "Kulağa eğlenceli geliyor!"
        es: "Creo que va a ser divertido."
        pt-BR: "Acho que vai ser divertido."
        de: "Ich glaube, das wird lustig."
        fr: "Je pense que ça va être sympa."
        it: "Credo che sarà divertente."
        pl: "Myślę, że to będzie fajne."
