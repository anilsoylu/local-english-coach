# id: stable key. title: shown in the UI. role/setting: given to the model.
# opening: first line the coach says. chunks: phrases seeded into spaced repetition when this scenario is used.
# title and a chunk's meaning are in the learner's native language: a map by language code ({en: ..., tr: ...},
# codes from coach/languages.py) that falls back to en, or a plain string used for every language.
# persona: true adds the style note from data/personal/friend-persona.json when it exists (see coach/chats.py).

- id: smalltalk
  title:
    en: Small talk (weekend, food, plans)
    tr: Sohbet (hafta sonu, yemek, planlar)
    es: Charla informal (fin de semana, comida, planes)
    pt-BR: Papo informal (fim de semana, comida, planos)
    de: Smalltalk (Wochenende, Essen, Pläne)
    fr: Discussion légère (week-end, cuisine, projets)
    it: Due chiacchiere (weekend, cibo, progetti)
    pl: Pogawędka (weekend, jedzenie, plany)
    ru: Светская беседа (выходные, еда, планы)
    ja: 雑談（週末、食べ物、予定）
    ko: 가벼운 대화 (주말, 음식, 계획)
    zh: 闲聊（周末、美食、计划）
  role: a friendly coworker from another country, chatting before a meeting
  setting: Casual small talk about the weekend, food, hobbies and plans.
  opening: "Hey {name}! How was your weekend?"
  chunks:
    - phrase: "To be honest, ..."
      meaning:
        en: "Honestly, ..."
        tr: "Açıkçası, ..."
        es: "Sinceramente, ..."
        pt-BR: "Sinceramente, ..."
        de: "Ehrlich gesagt, ..."
        fr: "Franchement, ..."
        it: "Onestamente, ..."
        pl: "Szczerze mówiąc, ..."
        ru: "Честно говоря, ..."
        ja: "正直に言うと、..."
        ko: "솔직히, ..."
        zh: "说实话，..."
    - phrase: "I've been meaning to ..."
      meaning:
        en: "I've wanted to do ... for a while"
        tr: "Bir süredir ... yapmayı düşünüyorum"
        es: "Hace tiempo que quiero hacer ..."
        pt-BR: "Faz um tempo que quero fazer ..."
        de: "Ich wollte ... schon länger machen"
        fr: "J'ai envie de faire ... depuis un moment"
        it: "Ho voglia di fare ... da un po'"
        pl: "Od jakiegoś czasu chcę zrobić ..."
        ru: "Давно хочу ..."
        ja: "前から...をしたいと思っていた"
        ko: "오랫동안 ...해 보고 싶었어요"
        zh: "我一直想做……"
    - phrase: "It was nothing special, just ..."
      meaning:
        en: "Nothing special happened, only ..."
        tr: "Özel bir şey yoktu, sadece ..."
        es: "No pasó nada especial, solo ..."
        pt-BR: "Nada de especial aconteceu, só ..."
        de: "Nichts Besonderes ist passiert, nur ..."
        fr: "Rien de spécial, juste ..."
        it: "Niente di speciale, solo ..."
        pl: "Nic specjalnego, tylko ..."
        ru: "Ничего особенного, просто ..."
        ja: "特に何もなくて、ただ..."
        ko: "특별한 건 없었고, 그냥 ..."
        zh: "没什么特别的，只是……"

- id: upwork-discovery
  title:
    en: Upwork client call (understanding the need)
    tr: Upwork müşteri görüşmesi (ihtiyacı anlama)
    es: Llamada con cliente de Upwork (entender la necesidad)
    pt-BR: Chamada com cliente do Upwork (entender a necessidade)
    de: Upwork-Kundengespräch (Bedarf verstehen)
    fr: Appel client Upwork (comprendre le besoin)
    it: Chiamata con cliente di Upwork (capire il bisogno)
    pl: Rozmowa z klientem z Upwork (poznanie potrzeb)
    ru: Звонок клиента с Upwork (выяснение задачи)
    ja: Upworkのクライアントとの通話（ニーズの確認）
    ko: Upwork 클라이언트 통화 (요구 파악)
    zh: Upwork客户通话（了解需求）
  role: a US startup founder on a first video call with a freelancer they found on Upwork. You need a booking app. Ask about experience, approach and timeline, one thing at a time.
  setting: First client call. {name} should ask good questions and explain how they would work.
  opening: "Hi {name}, thanks for jumping on the call. So, I saw your profile. Can you tell me a bit about yourself?"
  chunks:
    - phrase: "Could you walk me through ...?"
      meaning:
        en: "Can you explain ... to me step by step?"
        tr: "Bana ... adım adım anlatır mısın?"
        es: "¿Me explicas ... paso a paso?"
        pt-BR: "Você me explica ... passo a passo?"
        de: "Kannst du mir ... Schritt für Schritt erklären?"
        fr: "Tu peux m'expliquer ... étape par étape ?"
        it: "Mi spieghi ... passo dopo passo?"
        pl: "Możesz mi krok po kroku wyjaśnić ...?"
        ru: "Можешь пошагово объяснить ...?"
        ja: "...を一つずつ説明してもらえますか？"
        ko: "...을(를) 단계별로 설명해 줄래요?"
        zh: "你能一步一步给我讲讲……吗？"
    - phrase: "Just to make sure I understand, ..."
      meaning:
        en: "To check that I understood correctly, ..."
        tr: "Doğru anladığımdan emin olmak için, ..."
        es: "Para confirmar que entendí bien, ..."
        pt-BR: "Pra confirmar se entendi certo, ..."
        de: "Um sicherzugehen, dass ich richtig verstanden habe, ..."
        fr: "Pour vérifier que j'ai bien compris, ..."
        it: "Per essere sicuro di aver capito bene, ..."
        pl: "Żeby sprawdzić, czy dobrze zrozumiałem, ..."
        ru: "Чтобы убедиться, что я правильно понял, ..."
        ja: "正しく理解できているか確認すると、..."
        ko: "제가 제대로 이해했는지 확인하자면, ..."
        zh: "为了确认我理解得对，……"
    - phrase: "What does success look like for you?"
      meaning:
        en: "What result would make you happy?"
        tr: "Senin için başarı neye benziyor?"
        es: "¿Qué resultado te haría feliz?"
        pt-BR: "Qual resultado deixaria você feliz?"
        de: "Welches Ergebnis würde dich glücklich machen?"
        fr: "Quel résultat te rendrait content ?"
        it: "Quale risultato ti renderebbe felice?"
        pl: "Jaki efekt by cię ucieszył?"
        ru: "Какой результат тебя бы порадовал?"
        ja: "どんな結果があれば満足ですか？"
        ko: "어떤 결과가 나오면 좋겠어요?"
        zh: "什么结果会让你满意？"
    - phrase: "I've worked on something similar before."
      meaning:
        en: "I have done a similar project before."
        tr: "Daha önce benzer bir şey üzerinde çalıştım."
        es: "Ya he hecho un proyecto parecido."
        pt-BR: "Já fiz um projeto parecido antes."
        de: "Ich habe schon mal ein ähnliches Projekt gemacht."
        fr: "J'ai déjà fait un projet similaire."
        it: "Ho già fatto un progetto simile."
        pl: "Robiłem już podobny projekt."
        ru: "Я уже делал похожий проект."
        ja: "以前、似たプロジェクトをやったことがあります。"
        ko: "전에 비슷한 프로젝트를 해 본 적이 있어요."
        zh: "我以前做过类似的项目。"

- id: upwork-price
  title:
    en: Talking price and timeline
    tr: Fiyat ve süre konuşma
    es: Hablar de precio y plazos
    pt-BR: Conversar sobre preço e prazo
    de: Über Preis und Zeitplan sprechen
    fr: Parler du prix et des délais
    it: Parlare di prezzo e tempi
    pl: Rozmowa o cenie i terminie
    ru: Обсуждение цены и сроков
    ja: 料金と納期の相談
    ko: 가격과 일정 이야기
    zh: 谈价格和时间
  role: a small business owner who likes {name}'s work but thinks the price is a bit high. Push back politely once or twice.
  setting: Negotiating price, scope and deadline for a web project.
  opening: "Okay, I looked at your proposal. Honestly, the price is a bit more than I expected. Can you explain how you got to that number?"
  chunks:
    - phrase: "The thing is, ..."
      meaning:
        en: "The main point is, ..."
        tr: "Mesele şu ki, ..."
        es: "Lo importante es que ..."
        pt-BR: "O ponto é que ..."
        de: "Der springende Punkt ist, dass ..."
        fr: "Le fond du problème, c'est que ..."
        it: "Il punto è che ..."
        pl: "Chodzi o to, że ..."
        ru: "Дело в том, что ..."
        ja: "要するに、..."
        ko: "핵심은 ..."
        zh: "问题是……"
    - phrase: "If we reduce the scope, ..."
      meaning:
        en: "If we do less work in the project, ..."
        tr: "Kapsamı daraltırsak, ..."
        es: "Si hacemos menos trabajo en el proyecto, ..."
        pt-BR: "Se fizermos menos trabalho no projeto, ..."
        de: "Wenn wir beim Projekt weniger machen, ..."
        fr: "Si on réduit le travail sur le projet, ..."
        it: "Se facciamo meno lavoro sul progetto, ..."
        pl: "Jeśli zrobimy mniej w projekcie, ..."
        ru: "Если сделать в проекте меньше, ..."
        ja: "プロジェクトの作業を減らすなら、..."
        ko: "프로젝트 작업을 줄이면, ..."
        zh: "如果项目少做一些，……"
    - phrase: "I can be flexible on ..."
      meaning:
        en: "I can change ... a little for you"
        tr: "... konusunda esnek olabilirim"
        es: "Puedo ser flexible con ... por ti"
        pt-BR: "Posso mudar um pouco ... por você"
        de: "Bei ... kann ich dir ein bisschen entgegenkommen"
        fr: "Je peux un peu changer ... pour toi"
        it: "Posso cambiare un po' ... per te"
        pl: "Mogę trochę zmienić ... dla ciebie"
        ru: "Я могу немного изменить ... для тебя"
        ja: "...は少し融通をきかせられます"
        ko: "...은(는) 조금 조정할 수 있어요"
        zh: "...我可以为你稍微调整一下"
    - phrase: "Let me get back to you on that."
      meaning:
        en: "I'll answer you about this later."
        tr: "Bu konuda sana dönerim."
        es: "Te respondo sobre eso más tarde."
        pt-BR: "Te respondo sobre isso depois."
        de: "Ich melde mich dazu bei dir."
        fr: "Je te reviens là-dessus."
        it: "Ti faccio sapere su questo."
        pl: "Odezwę się w tej sprawie."
        ru: "Я отвечу на это позже."
        ja: "それについては後で返事しますね。"
        ko: "그건 나중에 알려 드릴게요."
        zh: "这件事我稍后回复你。"

- id: upwork-delay
  title:
    en: Reporting a delay or a problem
    tr: Gecikme ve sorun bildirme
    es: Avisar de un retraso o un problema
    pt-BR: Avisar sobre um atraso ou problema
    de: Eine Verzögerung oder ein Problem melden
    fr: Signaler un retard ou un problème
    it: Segnalare un ritardo o un problema
    pl: Zgłaszanie opóźnienia lub problemu
    ru: Сообщить о задержке или проблеме
    ja: 遅れや問題の報告
    ko: 지연이나 문제 알리기
    zh: 汇报延期或问题
  role: a client waiting for a feature. You are a little worried about the deadline but friendly.
  setting: "{name} has to explain a delay or a technical problem and propose a new plan."
  opening: "Hi {name}, quick check-in. Are we still on track for Friday's demo?"
  chunks:
    - phrase: "I wanted to give you a heads-up about ..."
      meaning:
        en: "I wanted to tell you early about ..."
        tr: "... hakkında önceden haber vermek istedim"
        es: "Quería avisarte con tiempo sobre ..."
        pt-BR: "Queria te avisar com antecedência sobre ..."
        de: "Ich wollte dir früh Bescheid geben über ..."
        fr: "Je voulais te prévenir tôt au sujet de ..."
        it: "Volevo avvisarti in anticipo di ..."
        pl: "Chciałem cię wcześniej uprzedzić o ..."
        ru: "Хочу заранее предупредить тебя о ..."
        ja: "...について早めにお知らせしたいと思いまして"
        ko: "...에 대해 미리 알려 드리고 싶었어요"
        zh: "想提前跟你说一下……的事"
    - phrase: "We ran into an issue with ..."
      meaning:
        en: "We found a problem with ..."
        tr: "... ile ilgili bir sorunla karşılaştık"
        es: "Encontramos un problema con ..."
        pt-BR: "Encontramos um problema com ..."
        de: "Wir haben ein Problem mit ... festgestellt"
        fr: "On a rencontré un problème avec ..."
        it: "Abbiamo riscontrato un problema con ..."
        pl: "Natrafiliśmy na problem z ..."
        ru: "Мы столкнулись с проблемой в ..."
        ja: "...に問題が見つかりました"
        ko: "...에 문제가 생겼어요"
        zh: "我们在……上遇到了一个问题"
    - phrase: "I'll keep you posted."
      meaning:
        en: "I'll tell you when there is news."
        tr: "Seni gelişmelerden haberdar ederim."
        es: "Te aviso cuando haya novedades."
        pt-BR: "Te aviso quando tiver novidades."
        de: "Ich sage dir Bescheid, wenn es Neuigkeiten gibt."
        fr: "Je te tiens au courant s'il y a du nouveau."
        it: "Ti aggiorno quando ci sono novità."
        pl: "Dam znać, kiedy będą nowości."
        ru: "Сообщу, когда будут новости."
        ja: "進展があったらお知らせします。"
        ko: "진행 상황이 생기면 알려 드릴게요."
        zh: "有进展我会告诉你。"

- id: standup
  title:
    en: Daily stand-up
    tr: Günlük toplantı (stand-up)
    es: Reunión diaria (stand-up)
    pt-BR: Reunião diária (stand-up)
    de: Tägliches Stand-up
    fr: Daily (stand-up quotidien)
    it: Daily (stand-up quotidiano)
    pl: Codzienny stand-up
    ru: Ежедневный стендап
    ja: デイリースタンドアップ
    ko: 데일리 스탠드업
    zh: 每日站会
  role: a team lead running a short daily stand-up in a remote dev team
  setting: "{name} says what they did yesterday, what they will do today, and any blockers."
  opening: "Morning! Let's start with you, {name}. What did you work on yesterday?"
  chunks:
    - phrase: "I'm currently working on ..."
      meaning:
        en: "Right now I'm working on ..."
        tr: "Şu anda ... üzerinde çalışıyorum"
        es: "Ahora mismo estoy trabajando en ..."
        pt-BR: "Agora estou trabalhando em ..."
        de: "Gerade arbeite ich an ..."
        fr: "En ce moment, je travaille sur ..."
        it: "In questo momento sto lavorando su ..."
        pl: "Obecnie pracuję nad ..."
        ru: "Сейчас я работаю над ..."
        ja: "今は...に取り組んでいます"
        ko: "지금은 ...을(를) 작업하고 있어요"
        zh: "我现在在做……"
    - phrase: "I'm blocked on ..."
      meaning:
        en: "I can't continue because of ..."
        tr: "... yüzünden ilerleyemiyorum"
        es: "No puedo seguir por ..."
        pt-BR: "Não consigo continuar por causa de ..."
        de: "Ich komme wegen ... nicht weiter"
        fr: "Je ne peux pas avancer à cause de ..."
        it: "Non posso andare avanti per via di ..."
        pl: "Nie mogę iść dalej przez ..."
        ru: "Не могу продолжать из-за ..."
        ja: "...のせいで先に進めません"
        ko: "...때문에 진행을 못 하고 있어요"
        zh: "因为……，我没法继续"
    - phrase: "It should be done by ..."
      meaning:
        en: "It will probably be finished by ..."
        tr: "... kadar bitmiş olmalı"
        es: "Probablemente estará listo para ..."
        pt-BR: "Deve estar pronto até ..."
        de: "Es sollte bis ... fertig sein"
        fr: "Ça devrait être fini d'ici ..."
        it: "Dovrebbe essere finito entro ..."
        pl: "Prawdopodobnie będzie gotowe do ..."
        ru: "Скорее всего, будет готово к ..."
        ja: "たぶん...までには終わります"
        ko: "아마 ...까지는 끝날 거예요"
        zh: "应该会在……前完成"

- id: interview
  title:
    en: Job interview
    tr: İş görüşmesi
    es: Entrevista de trabajo
    pt-BR: Entrevista de emprego
    de: Vorstellungsgespräch
    fr: Entretien d'embauche
    it: Colloquio di lavoro
    pl: Rozmowa o pracę
    ru: Собеседование
    ja: 就職面接
    ko: 취업 면접
    zh: 求职面试
  role: a friendly hiring manager at a European software company interviewing {name} for a remote React Native role
  setting: Job interview. Questions about experience, projects, strengths, and why this job.
  opening: "Hi {name}, nice to meet you. To start, could you tell me a little about yourself and your background?"
  chunks:
    - phrase: "One project I'm proud of is ..."
      meaning:
        en: "A project I feel good about is ..."
        tr: "Gurur duyduğum projelerden biri ..."
        es: "Un proyecto del que estoy orgulloso es ..."
        pt-BR: "Um projeto de que me orgulho é ..."
        de: "Ein Projekt, auf das ich stolz bin, ist ..."
        fr: "Un projet dont je suis fier, c'est ..."
        it: "Un progetto di cui vado fiero è ..."
        pl: "Projekt, z którego jestem dumny, to ..."
        ru: "Проект, которым я горжусь: ..."
        ja: "自信を持っているプロジェクトは...です"
        ko: "제가 자신 있게 말할 수 있는 프로젝트는 ...이에요"
        zh: "我比较满意的一个项目是……"
    - phrase: "I'm comfortable with ..."
      meaning:
        en: "I know ... well and feel confident with it"
        tr: "... konusunda rahatım"
        es: "Conozco bien ... y me siento seguro con ello"
        pt-BR: "Conheço bem ... e me sinto seguro com isso"
        de: "Ich kenne ... gut und fühle mich sicher damit"
        fr: "Je connais bien ... et je suis à l'aise avec"
        it: "Conosco bene ... e mi sento sicuro"
        pl: "Dobrze znam ... i czuję się w tym pewnie"
        ru: "Я хорошо знаю ... и уверенно с этим работаю"
        ja: "...はよく分かっていて、自信があります"
        ko: "...은(는) 잘 알고 있고 자신 있어요"
        zh: "我很熟悉……，对它很有信心"
    - phrase: "That's a good point."
      meaning:
        en: "I agree, you're right about that."
        tr: "Bu iyi bir nokta."
        es: "Estoy de acuerdo, tienes razón."
        pt-BR: "Concordo, você tem razão."
        de: "Da stimme ich zu, du hast recht."
        fr: "Je suis d'accord, tu as raison."
        it: "Sono d'accordo, hai ragione."
        pl: "Zgadzam się, masz rację."
        ru: "Согласен, ты прав."
        ja: "そのとおりですね。"
        ko: "맞아요, 그 말이 맞아요."
        zh: "我同意，你说得对。"

